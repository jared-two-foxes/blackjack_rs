[workspace]
members = [".", "client"]
resolver = "2"

[package]
name = "blackjack"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
harness = []

[dependencies]
chrono = "0.4.38"
log = "0.4.22"
timer = "0.2.0"
tokio = { version = "1.39.2", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
uuid = { version = "1.7.0", features = ["v4", "fast-rng", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
flexi_logger = "0.29.0"
tower = { version = "0.4", features = [ "util" ] }

[[bin]]
name = "harness"
path = "src/bin/harness.rs"
required-features = ["harness"]
